name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore dependencies
        run: dotnet restore RoomBooking.sln --locked-mode

      - name: Build
        run: dotnet build RoomBooking.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RoomBooking.sln --configuration Release --no-build --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/RoomBooking.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/RoomBooking.Web
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend/RoomBooking.Web
        run: npm test

      - name: Build frontend
        working-directory: frontend/RoomBooking.Web
        run: npm run build

      - name: Build production container
        run: docker build --tag room-booking:ci .
